<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernen">
<title>Bayazit Lern-App</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.thema=localStorage.getItem("kompass_thema")||"dunkel"}catch(e){}</script>
<style>
:root{--bg:var(--bg);--card:#0f1620;--card2:#0b1118;--line:#1b2532;--txt:#dfe6ef;--mut:#7f8b9c;
 --grn:#1fcf8f;--red:#f0605d;--gold:#f5c542;--blue:#4c9aff;--lila:#b388ff;--orange:#ff9f43;--acc:var(--grn);
 --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);padding:18px 14px 40px;font-size:15.5px;line-height:1.5;
 background-image:radial-gradient(900px 400px at 100% -10%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 70%)}
.wrap{max-width:1240px;margin:0 auto}
a{color:var(--acc)}
/* ---------- Kopf ---------- */
header.kopf{margin-bottom:18px}
.zurueck{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-decoration:none;background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:10px;margin-bottom:16px;transition:.2s}
.zurueck:hover{color:var(--acc);border-color:var(--acc)}
.meta{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
h1{font-family:var(--mono);font-weight:800;font-size:1.65rem;letter-spacing:.04em;text-transform:uppercase;color:var(--acc);text-shadow:0 0 24px color-mix(in srgb,var(--acc) 35%,transparent);line-height:1.15}
h2{font-family:var(--mono);font-weight:700;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
/* ---------- Navigation als Pillen ---------- */
nav{display:flex;gap:8px;overflow-x:auto;margin:0 -14px 18px;padding:2px 14px 6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex-shrink:0;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 14px;border-radius:12px;cursor:pointer;font-family:var(--mono);font-weight:700;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;transition:.2s}
nav button:hover{color:var(--txt)}
nav button.an{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--card));box-shadow:0 0 18px color-mix(in srgb,var(--acc) 18%,transparent)}
/* ---------- Karten ---------- */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--acc);opacity:.85}
.card h2{margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;width:90px;height:90px;right:-30px;top:-30px;border-radius:50%;background:var(--acc);opacity:.08;filter:blur(10px)}
.kpi .l{font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.12em}
.kpi .w{font-family:var(--mono);font-size:1.35rem;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* ---------- Formulare ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
input,select,textarea{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 11px;font-size:.95rem;font-family:var(--sans);letter-spacing:0;text-transform:none;font-weight:400;transition:.2s;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
input[type=checkbox]{accent-color:var(--acc);width:18px;height:18px}
textarea{min-height:70px;grid-column:1/-1}
.full{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--acc) 14%,var(--card));color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);padding:10px 16px;border-radius:12px;font-family:var(--mono);font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.2s}
.btn:hover{background:color-mix(in srgb,var(--acc) 22%,var(--card));box-shadow:0 0 18px color-mix(in srgb,var(--acc) 22%,transparent)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn.grau{background:var(--card2);color:var(--txt);border-color:var(--line)}
.btn.grau:hover{border-color:var(--mut);box-shadow:none}
.btn.rot{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent)}
.reihe{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.calc{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--mut);padding:6px 0}
.calc span{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.calc b{color:var(--txt);font-family:var(--mono)}
/* ---------- Tabellen ---------- */
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);color:var(--mut);font-weight:700;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
td{font-variant-numeric:tabular-nums}
tr.zeile{cursor:pointer;transition:.15s}tr.zeile:hover{background:var(--card2)}
.scroll{overflow-x:auto}
.up{color:var(--grn)}.down{color:var(--red)}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-family:var(--mono);font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.tag.offen{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 55%,transparent)}
.tag.frei{color:var(--grn);border-color:color-mix(in srgb,var(--grn) 55%,transparent)}
.tag.bald{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
canvas{width:100%;height:240px;display:block}
.filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hinweis{font-size:.82rem;color:var(--mut);margin-top:10px;line-height:1.55}
.hinweis b{color:var(--txt)}
.leer{color:var(--mut);text-align:center;padding:26px;white-space:normal}
.mini{font-size:.8rem;color:var(--mut)}
.bild{max-width:100%;border-radius:12px;margin-top:8px}
/* Infobox mit farbiger Überschrift */
.info{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.info .k{font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
/* Dialog */
#dlg{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding:14px;z-index:20}
@media(min-width:700px){#dlg{align-items:center}}
#dlg .card{max-width:640px;width:100%;max-height:88vh;overflow:auto;animation:hoch .3s ease}
/* ---------- Animationen ---------- */
@keyframes rein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes hoch{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
section:not([hidden])>*,.kpis>*,.anim>*{animation:rein .45s cubic-bezier(.2,.7,.2,1) both}
section:not([hidden])>*:nth-child(2),.kpis>*:nth-child(2),.anim>*:nth-child(2){animation-delay:.05s}
section:not([hidden])>*:nth-child(3),.kpis>*:nth-child(3),.anim>*:nth-child(3){animation-delay:.1s}
section:not([hidden])>*:nth-child(4),.kpis>*:nth-child(4),.anim>*:nth-child(4){animation-delay:.15s}
section:not([hidden])>*:nth-child(5),.kpis>*:nth-child(5),.anim>*:nth-child(5){animation-delay:.2s}
section:not([hidden])>*:nth-child(n+6),.kpis>*:nth-child(n+6),.anim>*:nth-child(n+6){animation-delay:.25s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
::selection{background:color-mix(in srgb,var(--acc) 35%,transparent)}

/* ---------- Hell-Modus ---------- */
html[data-thema=hell]{--bg:#f3f5f8;--card:#ffffff;--card2:#eef1f5;--line:#d7dde5;--txt:#111a26;--mut:#5d6878;
 --grn:#0fa872;--red:#d9443f;--gold:#c99a0a;--blue:#2f7be0;--lila:#8a5ce6;--orange:#e7801c}
html[data-thema=hell] body{background-image:radial-gradient(900px 400px at 100% -10%,color-mix(in srgb,var(--acc) 7%,transparent),transparent 70%)}
html[data-thema=hell] .card,html[data-thema=hell] .kpi,html[data-thema=hell] .k{box-shadow:0 1px 3px #0000000d}
html[data-thema=hell] h1{text-shadow:none}
html,body{transition:background-color .3s,color .3s}
header.kopf{position:relative}
.thema{position:absolute;right:0;top:0;width:42px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:1.1rem;cursor:pointer;transition:.2s;z-index:3}
.thema:hover{border-color:var(--acc);box-shadow:0 0 14px color-mix(in srgb,var(--acc) 25%,transparent)}

.profile{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.prof{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:18px;padding:24px;text-align:center;cursor:pointer;transition:.2s}
.prof:hover,.mod:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 15%,transparent)}
.prof .i{font-size:3.5rem}.prof .n{font-family:var(--mono);font-size:1.15rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:6px 0}
.module{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mod{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;cursor:pointer;transition:.2s}
.mod .i{font-size:2.2rem}.mod .n{font-weight:600;margin-top:8px;font-size:.92rem}
.mod .s{font-size:.8rem;color:var(--mut);margin-top:4px}
.quiz{max-width:560px;margin:0 auto;text-align:center}
.frage{font-family:var(--mono);font-size:2.4rem;font-weight:800;margin:24px 0;line-height:1.2;text-shadow:0 0 30px color-mix(in srgb,var(--acc) 30%,transparent)}
.frage.wort{font-size:2rem}
.antwort{font-family:var(--mono);font-size:2rem;text-align:center;width:100%;max-width:300px;padding:14px;border-radius:14px}
.wahl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.wahl button{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:16px;border-radius:14px;font-size:1.15rem;cursor:pointer;transition:.2s}.wahl button:hover{border-color:var(--acc)}
.wahl button.richtig{background:color-mix(in srgb,var(--grn) 18%,var(--card));border-color:var(--grn);color:var(--grn)}.wahl button.falsch{background:color-mix(in srgb,var(--red) 15%,var(--card));border-color:var(--red);color:var(--red)}
.fb{min-height:40px;font-size:1.3rem;font-weight:700;margin:14px 0}
.balken{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin:10px 0}
.balken div{height:100%;background:var(--acc);box-shadow:0 0 12px var(--acc);transition:.3s}
.sterne{font-size:2.6rem;letter-spacing:6px;margin:14px 0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--mut)}
.abz{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.abz span{background:var(--bg);border:1px solid var(--gold);color:var(--gold);padding:5px 10px;border-radius:999px;font-family:var(--mono);font-weight:700;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase}
.abz span.zu{opacity:.35;filter:grayscale(1);border-color:var(--line)}
svg.uhr{width:220px;height:220px;margin:10px auto;display:block}
.timer{font-size:1.4rem;font-weight:700;color:var(--gold)}
.mini{font-size:.8rem;color:var(--mut)}
</style>
</head>
<body style="--acc:var(--lila)">
<div class="wrap">
<header class="kopf"><button class="thema" id="themaBtn" title="Hell/Dunkel">☀️</button><a class="zurueck" href="https://kompassapps.de">‹ Zurück</a><div class="meta" id="meta">&nbsp;</div><h1>Lern-App</h1></header>

<section id="v-wer">
 <h2 style="margin-bottom:14px;font-size:1.2rem">Wer lernt heute? 👋</h2>
 <div class="profile" id="profile"></div>
 <div class="reihe" style="margin-top:16px"><button class="btn grau" id="zuEltern">👨‍👩‍👦 Eltern-Bereich</button></div>
</section>

<section id="v-menu" hidden>
 <div class="reihe" style="justify-content:space-between;margin-bottom:12px"><button class="btn grau" data-zu="wer">◀ Wechseln</button><div id="kopf" style="font-weight:700;font-size:1.1rem"></div></div>
 <div class="card" style="text-align:center"><div id="tagesziel"></div><div class="balken"><div id="zielBalken"></div></div><div class="abz" id="abzeichen"></div></div>
 <h2 style="margin:18px 0 10px;color:var(--grn)">➗ Mathe</h2><div class="module" id="mMathe"></div>
 <h2 style="margin:22px 0 10px;color:var(--blue)">🇬🇧 Englisch-Vokabeln</h2><div class="module" id="mVok"></div>
 <h2 style="margin:22px 0 10px;color:var(--gold)">🎯 Spezial</h2><div class="module" id="mSpez"></div>
</section>

<section id="v-quiz" hidden><div class="quiz">
 <div class="top"><button class="btn grau" id="abbruch" style="padding:6px 12px">✖</button><span id="qInfo"></span><span class="timer" id="timer"></span></div>
 <div class="balken"><div id="qBalken"></div></div>
 <div id="qBild"></div>
 <div class="frage" id="frage"></div>
 <form id="qForm"><input class="antwort" id="antwort" autocomplete="off" inputmode="numeric"><div style="margin-top:12px"><button class="btn" style="font-size:1.1rem;padding:12px 28px">Prüfen ✔</button></div></form>
 <div class="wahl" id="wahl"></div>
 <div class="fb" id="fb"></div>
 <button class="btn grau" id="sprich" hidden>🔊 Anhören</button>
</div></section>

<section id="v-ende" hidden><div class="quiz card">
 <h2 style="font-size:1.6rem" id="eTitel"></h2><div class="sterne" id="eSterne"></div><div id="eText" style="font-size:1.1rem"></div><div id="eFehler" style="margin-top:12px"></div>
 <div class="reihe" style="justify-content:center;margin-top:18px"><button class="btn" id="nochmal">🔁 Nochmal</button><button class="btn grau" id="fehlerUeben" hidden>📌 Fehler üben</button><button class="btn grau" data-zu="menu">🏠 Menü</button></div>
</div></section>

<section id="v-eltern" hidden>
 <div class="reihe" style="margin-bottom:12px"><button class="btn grau" data-zu="wer">◀ Zurück</button></div>
 <div class="card scroll"><h2>📊 Fortschritt</h2><table id="statTab"></table></div>
 <div class="card"><h2>👧 Kinder</h2><div id="kinderEdit"></div><button class="btn grau" id="kindNeu" style="margin-top:8px">➕ Kind</button></div>
 <div class="card"><h2>📝 Eigene Vokabelliste (z. B. aus dem Schulbuch)</h2>
 <div class="form"><label>Name der Liste<input id="vlName" placeholder="z. B. Unit 3"></label><label>Für<select id="vlFuer"></select></label>
 <label class="full">Vokabeln – je Zeile: Deutsch = Englisch<textarea id="vlText" style="min-height:140px" placeholder="der Hund = dog&#10;die Schule = school&#10;laufen = to run"></textarea></label></div>
 <div class="reihe"><button class="btn" id="vlSpeichern">💾 Liste speichern</button><span class="hinweis" id="vlInfo"></span></div>
 <div id="vlListen" style="margin-top:12px"></div></div>
 <div id="sich"></div>
</section>
</div>

<script>/* gemeinsame Helfer */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const DB={db:null,name:"app",
 async open(n){this.name=n;return new Promise(r=>{try{const q=indexedDB.open(n,1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>{this.db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})},
 async get(k){if(!this.db){try{return JSON.parse(localStorage.getItem(this.name+"_"+k))}catch(e){return null}}
  return new Promise(r=>{const q=this.db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)})},
 async set(k,v){if(!this.db){try{localStorage.setItem(this.name+"_"+k,JSON.stringify(v))}catch(e){}return}
  return new Promise(r=>{const t=this.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=r;t.onerror=r})}
};
const eur=(v,d=2)=>v==null||isNaN(v)?"–":(+v).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d})+" €";
const zahl=(v,d=0)=>v==null||isNaN(v)?"–":(+v).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const fdat=s=>s?new Date(s+"T12:00").toLocaleDateString("de-DE"):"–";
const heute=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tageZw=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
function datei(name,inhalt,typ,info){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([inhalt],{type:typ}));a.download=name;document.body.appendChild(a);a.click();a.remove();info&&(info.textContent="✅ Datei heruntergeladen.")}catch(e){info&&(info.textContent="Herunterladen ging nicht – nutze „Als Text kopieren“.")}}
async function kopiere(t,info){try{await navigator.clipboard.writeText(t);info&&(info.textContent="✅ Kopiert.")}catch(e){info&&(info.textContent="Kopieren nicht möglich.")}}
function zweimal(btn,text){if(btn.dataset.ok!=="1"){btn.dataset.ok="1";btn.dataset.alt=btn.textContent;btn.textContent=text||"Wirklich? Nochmal tippen";setTimeout(()=>{if(btn.dataset.ok==="1"){btn.dataset.ok="";btn.textContent=btn.dataset.alt}},4000);return false}btn.dataset.ok="";btn.textContent=btn.dataset.alt;return true}
/* Sicherungs-Bereich: el = Container, getData()/setData(obj) */
function sicherung(el,app,getData,setData){
 el.innerHTML=`<div class="card"><h2>💾 Sicherung</h2><p class="hinweis" style="margin-bottom:12px">Deine Daten sind nur in diesem Browser gespeichert. Sichere sie ab und zu als Datei – so kannst du sie auch auf ein anderes Gerät holen.</p>
 <div class="reihe"><button class="btn" data-a="ex">⬇️ Sicherung herunterladen</button><button class="btn grau" data-a="cp">📋 Als Text kopieren</button>
 <label class="btn grau" style="flex-direction:row;color:var(--txt)">⬆️ Sicherung laden<input type="file" accept=".json,application/json" hidden></label></div><div class="hinweis" data-a="info"></div></div>`;
 const info=el.querySelector('[data-a=info]');
 const js=()=>JSON.stringify({app,datum:new Date().toISOString(),daten:getData()});
 el.querySelector('[data-a=ex]').onclick=()=>datei(app+"-"+heute()+".json",js(),"application/json",info);
 el.querySelector('[data-a=cp]').onclick=()=>kopiere(js(),info);
 el.querySelector('input[type=file]').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!==app)throw 0;await setData(d.daten);info.textContent="✅ Sicherung geladen."}catch(err){info.textContent="❌ Diese Datei passt nicht zu dieser App."}};
}
/* Farben aus CSS lesen */
const farbeVar=n=>getComputedStyle(document.body).getPropertyValue(n).trim()||"#7f8b9c";
/* Pille im Diagramm: dunkler Hintergrund, farbiger Rahmen, Mono-Schrift */
function pille(g,text,x,y,farbe,ausr="center"){g.font="700 11px 'JetBrains Mono',monospace";const w=g.measureText(text).width+14,h=20;
 let x0=ausr==="center"?x-w/2:ausr==="right"?x-w:x;x0=Math.max(2,Math.min(x0,g.canvas.clientWidth-w-2));
 g.fillStyle=farbeVar("--bg");g.strokeStyle=farbe;g.lineWidth=1;g.beginPath();g.roundRect(x0,y-h/2,w,h,10);g.fill();g.stroke();
 g.fillStyle=farbe;g.textBaseline="middle";g.fillText(text,x0+7,y+1);g.textBaseline="alphabetic"}
/* Balkendiagramm im Terminal-Look */
function balken(canvas,labels,werte,opt={}){const d=devicePixelRatio||1,W=canvas.clientWidth,H=opt.h||230;canvas.width=W*d;canvas.height=H*d;canvas.style.height=H+"px";const g=canvas.getContext("2d");g.scale(d,d);g.clearRect(0,0,W,H);
 const acc=opt.farbe||farbeVar("--acc");
 if(!werte.length||werte.every(v=>!v)){g.fillStyle=farbeVar("--mut");g.font="13px Inter,system-ui";g.fillText(opt.leer||"Noch keine Daten",10,30);return}
 const mx=Math.max(...werte,0)*1.18||1,L=44,B=26,T=14,bw=(W-L-6)/werte.length;
 g.font="600 10px 'JetBrains Mono',monospace";g.strokeStyle=farbeVar("--line");g.setLineDash([3,4]);
 for(let i=0;i<=3;i++){const v=mx*i/3,y=T+(H-T-B)*(1-i/3);g.beginPath();g.moveTo(L,y);g.lineTo(W,y);g.stroke();g.fillStyle=farbeVar("--mut");g.fillText(zahl(v,v<10&&mx<10?1:0),2,y+4)}
 g.setLineDash([]);
 const imax=werte.indexOf(Math.max(...werte));
 werte.forEach((v,i)=>{const h=(H-T-B)*(v/mx),x=L+i*bw+bw*.18,w=bw*.64,y=H-B-h;
  const gr=g.createLinearGradient(0,y,0,H-B);gr.addColorStop(0,acc);gr.addColorStop(1,acc+"33");
  g.save();if(i===imax){g.shadowColor=acc;g.shadowBlur=14}g.fillStyle=gr;g.beginPath();g.roundRect(x,y,w,h,[4,4,0,0]);g.fill();g.restore();
  g.fillStyle=farbeVar("--mut");g.font="600 10px 'JetBrains Mono',monospace";if(werte.length<=14||i%2===0)g.fillText(labels[i],L+i*bw+bw*.5-g.measureText(labels[i]).width/2,H-8)});
 if(werte[imax])pille(g,(opt.fmt||zahl)(werte[imax]),L+imax*bw+bw/2,T+(H-T-B)*(1-werte[imax]/mx)-14,acc);
}

 plus20:{n:"Plus & Minus bis 20",i:"➕",st:"g",f(){const a=r(1,15),b=r(1,20-a);return Math.random()<.5?{q:`${a} + ${b}`,a:a+b}:{q:`${a+b} − ${b}`,a:a}}},

 einmaleins:{n:"Kleines Einmaleins",i:"✖️",st:"g",f(){const a=r(1,10),b=r(1,10);return{q:`${a} · ${b}`,a:a*b}}},

 grosses:{n:"Großes Einmaleins",i:"🧮",st:"r",f(){const a=r(11,20),b=r(2,9);return{q:`${a} · ${b}`,a:a*b}}},
 negativ:{n:"Negative Zahlen",i:"🌡️",st:"r",f(){const a=r(-20,20),b=r(-20,20),o=Math.random()<.5;return{q:`${a} ${o?"+":"−"} ${b<0?"("+b+")":b}`.replace(/-/g,"−"),a:o?a+b:a-b}}},
 brueche:{n:"Brüche kürzen",i:"🍕",st:"r",f(){const z=r(1,8),n=r(z+1,12),k=r(2,6),g=ggt(z,n);return{q:`${z*k}/${n*k} = ?`,a:`${z/g}/${n/g}`,typ:"bruch",hilfe:"so weit wie möglich kürzen, z. B. 3/4"}}},
 prozent:{n:"Prozent",i:"％",st:"r",f(){const p=[10,20,25,50,75,5,30][r(0,6)],g=r(1,20)*20;return{q:`${p} % von ${g}`,a:g*p/100}}},
 gleichung:{n:"Gleichungen",i:"🔤",st:"r",f(){const x=r(-10,15),a=r(2,9),b=r(-20,20);return{q:`${a}x ${b<0?"−":"+"} ${Math.abs(b)} = ${a*x+b}`,a:x,hilfe:"x = ?"}}},
 runden:{n:"Runden",i:"🎯",st:"g",f(){const z=r(101,9999),s=[10,100][r(0,1)];return{q:`${z.toLocaleString("de-DE")} auf ${s===10?"Zehner":"Hunderter"}`,a:Math.round(z/s)*s}}},
 kommazahl:{n:"Kommazahlen",i:"🔸",st:"r",f(){const a=r(1,99)/10,b=r(1,99)/10,o=Math.random()<.5;const e=o?a+b:a-b;return{q:`${String(a).replace(".",",")} ${o?"+":"−"} ${String(b).replace(".",",")}`,a:Math.round(e*10)/10}}}

function vokListe(id){if(id[0]==="L"){const l=D.listen.find(x=>"L"+x.id===id);return l?l.w:[]}return VOK[id].w.split("|").map(p=>p.split("="))}
function uhrAufgabe(){const h=r(1,12),m=K.stufe==="g"?[0,15,30,45][r(0,3)]:r(0,11)*5;const txt=`${h}:${String(m).padStart(2,"0")}`;
 const opts=new Set([txt]);while(opts.size<4){const h2=r(1,12),m2=K.stufe==="g"?[0,15,30,45][r(0,3)]:r(0,11)*5;opts.add(`${h2}:${String(m2).padStart(2,"0")}`)}
 const ha=(h%12+m/60)*30,ma=m*6,z=(a,l,w,c)=>`<line x1="100" y1="100" x2="${100+l*Math.sin(a*Math.PI/180)}" y2="${100-l*Math.cos(a*Math.PI/180)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
 const svg=`<svg class="uhr" viewBox="0 0 200 200"><circle cx="100" cy="100" r="95" fill="#f8fafc" stroke="#b388ff" stroke-width="6"/>${[...Array(12)].map((_,i)=>{const a=(i+1)*30*Math.PI/180;return `<text x="${100+75*Math.sin(a)}" y="${106-75*Math.cos(a)}" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">${i+1}</text>`}).join("")}
 ${[...Array(60)].map((_,i)=>{const a=i*6*Math.PI/180,l=i%5?4:8;return `<line x1="${100+92*Math.sin(a)}" y1="${100-92*Math.cos(a)}" x2="${100+(92-l)*Math.sin(a)}" y2="${100-(92-l)*Math.cos(a)}" stroke="#334155" stroke-width="${i%5?1:2}"/>`}).join("")}
 ${z(ha,48,7,"#0f172a")}${z(ma,72,4,"#ef4444")}<circle cx="100" cy="100" r="6" fill="#0f172a"/></svg>`;
 return{q:"Wie spät ist es?",a:txt,wahl:mischen([...opts]),bild:svg}}
function aufgabe(){const {id,art}=Q;
 if(art==="mathe"||art==="blitz"){const pool=art==="blitz"?(K.stufe==="g"?["plus20","einmaleins","geteilt"]:["einmaleins","grosses","negativ"]):[id];return MATHE[pool[r(0,pool.length-1)]].f()}
 if(art==="uhr")return uhrAufgabe();
 if(art==="vok"||art==="fehler"){const L=Q.liste;const p=L[Q.i%L.length];const rueck=art==="vok"&&Q.id!=="unregel"&&Math.random()<.3;
  if(p.mathe)return p.mathe;
  const alle=Q.alleW||L;const falsch=mischen(alle.filter(x=>x[1]!==p[1])).slice(0,3).map(x=>rueck?x[0]:x[1]);
  const tippen=Q.i%2===1&&!rueck;
  return rueck?{q:p[1],a:p[0],wahl:mischen([p[0],...falsch]),wort:1,en:p[1],de:p[0]}:{q:p[0],a:p[1],wahl:tippen?null:mischen([p[1],...falsch]),wort:1,en:p[1],de:p[0],tippen}}}
function starte(id,art){Q={id,art,i:0,richtig:0,fehler:[],max:art==="blitz"?999:10,ende:art==="blitz"?Date.now()+60000:null};
 if(art==="vok"){Q.liste=mischen(vokListe(id)).slice(0,10);Q.alleW=vokListe(id);if(Q.liste.length<2){return}Q.max=Q.liste.length}
 if(art==="fehler"){const f=Object.values(st().fehler);Q.liste=mischen(f).slice(0,10).map(x=>x.w?x.w:{mathe:{q:x.q,a:x.a}});Q.alleW=Q.liste.filter(x=>Array.isArray(x));if(Q.alleW.length<4)Q.alleW=Q.alleW.concat(vokListe("tiere"));Q.max=Q.liste.length}
 zeige("quiz");naechste();if(Q.ende)tick()}
function tick(){if(!Q||!Q.ende)return;const s=Math.max(0,Math.ceil((Q.ende-Date.now())/1000));$("#timer").textContent="⏱ "+s;if(s<=0)return ende();setTimeout(tick,250)}
function naechste(){if(!Q||$("#v-quiz").hidden)return;if(Q.i>=Q.max)return ende();Q.akt=aufgabe();const a=Q.akt;Q.gesperrt=false;

 $("#qBild").innerHTML=a.bild||"";$("#frage").textContent=a.q;$("#frage").classList.toggle("wort",!!a.wort);$("#fb").textContent=a.hilfe||"";$("#fb").style.color="var(--mut)";
 const inp=$("#antwort");inp.value="";

 else{$("#qForm").hidden=false;$("#wahl").innerHTML="";inp.inputMode=a.wort||a.typ==="bruch"?"text":"decimal";inp.placeholder=a.wort?"auf Englisch …":"?";setTimeout(()=>inp.focus(),50)}
 $("#sprich").hidden=!a.en}
function norm(s){return String(s).trim().toLowerCase().replace(/^to /,"").replace(/^(der|die|das) /,"").replace(/\s+/g," ").replace("−","-").replace(",",".")}
function pruefe(antw,btn){if(Q.gesperrt)return;const a=Q.akt;let ok;
 if(typeof a.a==="number")ok=Math.abs(parseFloat(String(antw).replace(",",".").replace("−","-"))-a.a)<1e-9;
 else ok=norm(antw)===norm(a.a)||(a.wort&&norm(antw)===norm(a.a.replace(/^to /,"")));
 if(antw===""&&!btn)return;
 Q.gesperrt=true;const s=st();s.gesamt++;
 const key=a.wort?"v:"+a.de:"m:"+a.q;
 if(ok){Q.richtig++;s.richtig++;s.tage[heute()]=(s.tage[heute()]||0)+1;delete s.fehler[key];
  $("#fb").textContent=["Super! ⭐","Richtig! 🎉","Klasse! 💪","Genau! ✅","Stark! 🚀"][r(0,4)];$("#fb").style.color="var(--grn)"}
 else{Q.fehler.push(a);s.fehler[key]=a.wort?{w:[a.de,a.en]}:{q:a.q,a:a.a};
  $("#fb").innerHTML=`Fast! Richtig ist: <b>${esc(typeof a.a==="number"?String(a.a).replace(".",",").replace("-","−"):a.a)}</b>`;$("#fb").style.color="var(--red)"}
 if(btn){$$("#wahl button").forEach(b=>{if(norm(b.textContent)===norm(a.a))b.classList.add("richtig")});if(!ok)btn.classList.add("falsch")}
 if(a.en&&ok)sprich(a.en);
 speichern();Q.i++;setTimeout(naechste,ok?(Q.ende?350:900):2200)}

 $("#kinderEdit").innerHTML=D.kinder.map(k=>`<div class="form" data-id="${k.id}" style="margin-bottom:8px"><label>Symbol<input data-k="ico" value="${esc(k.ico)}"></label><label>Name<input data-k="name" value="${esc(k.name)}"></label>
  <label>Schule<select data-k="stufe"><option value="g">Grundschule</option><option value="r" ${k.stufe==="r"?"selected":""}>Realschule</option></select></label><label>Tagesziel<input type="number" data-k="ziel" value="${k.ziel}"></label></div>`).join("");
 $("#vlFuer").innerHTML=`<option value="">Alle Kinder</option>`+D.kinder.map(k=>`<option value="${k.id}">${esc(k.name)}</option>`).join("");
 $("#vlListen").innerHTML=D.listen.map(l=>`<div class="reihe" style="margin-bottom:6px">📘 <b>${esc(l.name)}</b> <span class="mini">${l.w.length} Wörter${l.fuer?" · für "+esc(D.kinder.find(k=>k.id===l.fuer)?.name||""):""}</span><button class="btn grau" style="padding:3px 8px" data-ldel="${l.id}">🗑️</button></div>`).join("")}
$("#kinderEdit").addEventListener("change",async e=>{const k=D.kinder.find(x=>x.id===e.target.closest("[data-id]").dataset.id);k[e.target.dataset.k]=e.target.dataset.k==="ziel"?+e.target.value:e.target.value;await speichern()});
$("#kindNeu").onclick=async()=>{D.kinder.push({id:uid(),name:"Neues Kind",ico:"🙂",stufe:"g",ziel:20});await speichern();eltern()};
$("#vlSpeichern").onclick=async()=>{const w=$("#vlText").value.split("\n").map(z=>z.split(/\s*[=;\t]\s*/)).filter(p=>p.length>=2&&p[0]&&p[1]).map(p=>[p[0].trim(),p[1].trim()]);
 if(w.length<4){$("#vlInfo").textContent="Bitte mindestens 4 Wörter eingeben (Deutsch = Englisch).";return}
 D.listen.push({id:uid(),name:$("#vlName").value||"Meine Liste",fuer:$("#vlFuer").value,w});await speichern();$("#vlText").value="";$("#vlName").value="";$("#vlInfo").textContent=`✅ ${w.length} Vokabeln gespeichert`;eltern()};
$("#vlListen").onclick=async e=>{const b=e.target.closest("[data-ldel]");if(b&&zweimal(b,"?")){D.listen=D.listen.filter(l=>l.id!==b.dataset.ldel);await speichern();eltern()}};

(async()=>{await DB.open("lern_app");D=(await DB.get("daten"))||structuredClone(STD);
 sicherung($("#sich"),"lern-app",()=>D,async d=>{D=d;await speichern()});zeige("wer")})();
function meta(){const s=D.kinder.reduce((a,k)=>a+(D.stat[k.id]?.richtig||0),0);setMeta(`${D.kinder.length} KINDER · ${s} STERNE GESAMMELT`)}

/* Hell/Dunkel-Umschalter */
(function(){const b=document.getElementById("themaBtn");if(!b)return;const set=t=>{document.documentElement.dataset.thema=t;b.textContent=t==="hell"?"🌙":"☀️";b.title=t==="hell"?"Dunkel":"Hell";
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="hell"?"#f3f5f8":"#05080d";try{localStorage.setItem("kompass_thema",t)}catch(e){}if(window._tb)dispatchEvent(new Event("resize"))};
 set(document.documentElement.dataset.thema||"dunkel");window._tb=1;b.onclick=()=>set(document.documentElement.dataset.thema==="hell"?"dunkel":"hell")})();

if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
